<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Groupwork AI</title>
<style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#182334;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:35px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;margin:0 0 6px}p{color:#526178}.panel{background:white;border:1px solid #e1e8f1;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 3px 12px #1d38520a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person{border:1px solid #dce6f2;border-radius:12px;padding:15px}.person h3{margin:0 0 8px}.speaker{font-size:24px;font-weight:700;color:#1863b4}.small{font-size:13px;color:#64748b}button{border:0;background:#2167b5;color:white;padding:11px 18px;border-radius:9px;cursor:pointer}button:hover{background:#154d8b}#error{color:#b42318;white-space:pre-wrap}@media(max-width:550px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header><div><h1>🎙 Groupwork AI</h1><p>MCPサーバー連携ダッシュボード</p></div><button id="refresh">情報を更新</button></header><section class="panel"><h2>参加者</h2><div id="people" class="grid">読み込み中...</div></section><section class="panel"><h2>現在の話者</h2><div id="speaker" class="speaker">取得中...</div><p id="status" class="small"></p></section><section class="panel"><h2>AIファシリテーター</h2><p>今後、GPT-LIVEと連携して議論への質問や提案を表示します。</p><p class="small">※ 現段階では音声入力・話者識別・AI会話は未実装です。</p></section><p id="error" role="alert"></p></main>
<script>
async function get(url){const r=await fetch(url);const data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data}
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function refresh(){document.getElementById('error').textContent='';try{const [people,speaker]=await Promise.all([get('/api/participants'),get('/api/speaker')]);const area=document.getElementById('people');area.replaceChildren();for(const [id,p] of Object.entries(people)){const card=node('div','','person');card.append(node('h3',p.name||id),node('p','興味：'+(p.interests||[]).join('・')),node('p','得意：'+(p.skills||[]).join('・')));area.append(card)}document.getElementById('speaker').textContent=speaker.speaker?`参加者${speaker.speaker}`:'未判定';document.getElementById('status').textContent=`状態：${speaker.status||'不明'}${speaker.message?' / '+speaker.message:''}`;}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
